version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    # Neue Hauptversionen müssen zur .NET Version im Projekt passen und kommen deshalb nicht automatisch
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    # Ein neues .NET im Image passt nicht zum Projekt, das wird bewusst zusammen umgestellt
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
