name: Release

# Wird von Hand gestartet: Actions, Release, Run workflow, Version eingeben
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, zum Beispiel 1.0.0"
        required: true

# Rechte stehen bei den Jobs. Der Build führt fremden Code aus (NuGet Pakete, Tests)
# und bekommt deshalb weder Schreibrechte auf das Repository noch Rechte für Herkunftsnachweise.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Version prüfen
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Die Version muss so aussehen: 1.0.0"
            exit 1
          fi

      # Der Text für das Release kommt aus CHANGELOG.md. Ohne Abschnitt für diese Version geht es nicht weiter.
      - name: Changelog lesen
        run: |
          awk -v v="$VERSION" '$0 ~ "^## v?" v "( |$)" { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "In CHANGELOG.md fehlt der Abschnitt für $VERSION. Bitte zuerst den Workflow Changelog vorbereiten starten."
            exit 1
          fi
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$LAST" ]; then
            echo >> notes.md
            echo "[Alle Änderungen seit $LAST](${{ github.server_url }}/${{ github.repository }}/compare/$LAST...v$VERSION)" >> notes.md
          fi
          cat notes.md

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Tests ausführen
        run: dotnet test

      # Fertiges Programm für Windows und Linux, ohne dass .NET installiert sein muss
      - name: Programm bauen
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish src/Zwijg.Gateway -c Release -r $rid --self-contained -p:Version=$VERSION -o out/$rid
            # Versionsdatei und Update Skript, damit sich das Paket später selbst aktualisieren kann
            echo "$VERSION" > out/$rid/VERSION
          done
          cp scripts/update.ps1 out/win-x64/
          cp scripts/update.sh out/linux-x64/
          chmod +x out/linux-x64/update.sh out/linux-x64/Zwijg.Gateway
          for rid in win-x64 linux-x64; do
            (cd out/$rid && zip -qr ../../zwijg-$VERSION-$rid.zip .)
          done

      # Vor dem Veröffentlichen: Update von der letzten Version mit echten Daten
      - name: Update von der letzten Version testen
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tests/update/test-upgrade.sh out/linux-x64

      # docker-compose.yml zum Starten ohne Quellcode. Zeigt auf latest, damit "docker compose pull" Updates holt.
      - name: Docker Paket bauen
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          mkdir docker-paket
          sed -e "/build: \./d" -e "s#image: .*zwijg:latest#image: $IMAGE:latest#" docker-compose.yml > docker-paket/docker-compose.yml
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md CHANGELOG.md docker-paket/
          (cd docker-paket && zip -qr ../zwijg-$VERSION-docker.zip .)

      # Der Digest geht an den Job release, der den Herkunftsnachweis für das Image anlegt
      - name: Docker Image veröffentlichen
        id: image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg VERSION=$VERSION -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | cut -d@ -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            zwijg-${{ inputs.version }}-*.zip
            notes.md
          if-no-files-found: error

  # Führt nur Actions und gh aus, keinen Code aus dem Build
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release

      # Signierter Nachweis, dass ZIPs und Image aus diesem Workflow stammen. Prüfen mit gh attestation verify, siehe docs/betrieb.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zwijg-${{ inputs.version }}-*.zip

      - name: Bei ghcr.io anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" zwijg-$VERSION-*.zip \
            --title "Zwijg $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
