name: Release

# Wird von Hand gestartet: Actions, Release, Run workflow, Version eingeben
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, zum Beispiel 1.0.0"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version prüfen
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Die Version muss so aussehen: 1.0.0"
            exit 1
          fi

      # Der Text für das Release kommt aus CHANGELOG.md. Ohne Abschnitt für diese Version geht es nicht weiter.
      - name: Changelog lesen
        run: |
          awk -v v="$VERSION" '$0 ~ "^## v?" v "( |$)" { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "In CHANGELOG.md fehlt der Abschnitt für $VERSION. Bitte zuerst den Workflow Changelog vorbereiten starten."
            exit 1
          fi
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -n "$LAST" ]; then
            echo >> notes.md
            echo "[Alle Änderungen seit $LAST](${{ github.server_url }}/${{ github.repository }}/compare/$LAST...v$VERSION)" >> notes.md
          fi
          cat notes.md

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Tests ausführen
        run: dotnet test

      # Fertiges Programm für Windows und Linux, ohne dass .NET installiert sein muss
      - name: Programm bauen
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish src/Zwijg.Gateway -c Release -r $rid --self-contained -p:Version=$VERSION -o out/$rid
            # Versionsdatei und Update Skript, damit sich das Paket später selbst aktualisieren kann
            echo "$VERSION" > out/$rid/VERSION
          done
          cp scripts/update.ps1 out/win-x64/
          cp scripts/update.sh out/linux-x64/
          chmod +x out/linux-x64/update.sh out/linux-x64/Zwijg.Gateway
          for rid in win-x64 linux-x64; do
            (cd out/$rid && zip -qr ../../zwijg-$VERSION-$rid.zip .)
          done

      # docker-compose.yml zum Starten ohne Quellcode. Zeigt auf latest, damit "docker compose pull" Updates holt.
      - name: Docker Paket bauen
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          mkdir docker-paket
          sed -e "/build: \./d" -e "s#image: .*zwijg:latest#image: $IMAGE:latest#" docker-compose.yml > docker-paket/docker-compose.yml
          cp LICENSE NOTICE THIRD-PARTY-NOTICES.md CHANGELOG.md docker-paket/
          (cd docker-paket && zip -qr ../zwijg-$VERSION-docker.zip .)

      - name: Docker Image veröffentlichen
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg VERSION=$VERSION -t $IMAGE:$VERSION -t $IMAGE:latest .
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" zwijg-$VERSION-*.zip \
            --title "Zwijg $VERSION" \
            --target "$GITHUB_SHA" \
            --notes-file notes.md
