name: Gitleaks

# Pull Requests laufen über pull_request. push nur für main, sonst liefe bei eigenen Branches alles doppelt.
on:
  push:
    branches: [main]
  pull_request:

# Kommt ein neuer Stand in den Pull Request, wird der alte Lauf abgebrochen. Auf main läuft jeder Lauf zu Ende.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Sucht in allen Commits nach Passwörtern und Schlüsseln. Ausnahmen stehen in .gitleaks.toml
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
