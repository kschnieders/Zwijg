name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      # Damit auch die Tests für die Texterkennung laufen
      - name: Tesseract installieren
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu

      # Kleinstes Whisper Modell, damit auch die Tests fürs Diktieren laufen
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/whisper
          key: whisper-ggml-base

      - name: Whisper Modell laden
        run: |
          mkdir -p ~/whisper
          [ -f ~/whisper/ggml-base.bin ] || curl -fsSL -o ~/whisper/ggml-base.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          echo "ZWIJG_TEST_WHISPER_MODEL=$HOME/whisper/ggml-base.bin" >> "$GITHUB_ENV"

      - name: Tests ausführen
        run: dotnet test

      # Bricht ab, wenn ein genutztes Paket eine bekannte Sicherheitslücke hat
      - name: Pakete auf Sicherheitslücken prüfen
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "Mindestens ein Paket hat eine bekannte Sicherheitslücke"
            exit 1
          fi

  # Baut das Docker Image nur zur Probe, hochgeladen wird erst beim Release
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Image bauen
        run: docker build --build-arg VERSION=0.0.0 -t zwijg-test .
